# Chirpy theme configuration
# https://github.com/cotes2020/jekyll-theme-chirpy

theme: jekyll-theme-chirpy

lang: en
timezone: Europe/Stockholm

# Site Settings
title: Sarbashis Das, PhD.
tagline: Principal Data Scientist | GenAI Tech Lead | AI Leadership
description: >-
  Personal blog covering Generative AI, Machine Learning, LLMs, and AI Leadership.
url: "https://sarbashis.github.io"
baseurl: ""

github:
  username: sarbashis

social:
  name: Sarbashis Das
  email: dsarbashis@gmail.com
  links:
    - https://github.com/sarbashis
    - https://www.linkedin.com/in/sarbashis/
    - https://scholar.google.com/citations?user=MDDoPX0AAAAJ&hl=en

# Theme mode: auto | light | dark
mode: auto

# Avatar
avatar: /assets/img/avatar.jpg

# Comments
comments:
  # Available: disqus, giscus, utterances
  provider: giscus
  giscus:
    repo: sarbashis/sarbashis.github.io
    repo_id: # TODO: Get from https://giscus.app
    category: General
    category_id: # TODO: Get from https://giscus.app
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    emit_metadata: 0
    input_position: bottom
    theme: preferred_color_scheme
    lang: en
    lazy: true

# Analytics
analytics:
  google:
    id: UA-126790509-1 # TODO: Migrate to GA4 (G-XXXXXXX)

# Pagination
paginate: 10

# Permalink
permalink: /:categories/:year/:title/

# Markdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Build
future: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-include-cache

# Jekyll Archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Exclude
exclude:
  - "*.gem"
  - "*.gemspec"
  - vendor
  - .bundle
  - .sass-cache
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE.txt
  - run.sh
  - deploy_script.sh

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      pin: false
  - scope:
      path: _drafts
    values:
      layout: post
      comments: true
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
